[project]
name = "some-python"
version = "0.1.0"
description = "Hands-on Python 3.14 labs: sequences, dicts and sets, generators, concurrency and free-threading."
readme = "README.md"
authors = [
    { name = "JAGS", email = "78938133+JoseAngelGarciaSanchez@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short"]

[tool.ruff]
line-length = 120
